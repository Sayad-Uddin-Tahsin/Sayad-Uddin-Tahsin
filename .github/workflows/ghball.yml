name: Generate GHBall Animation

on:
  schedule:
    - cron: '0 */2 * * *'    # Runs every 2 hours
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Generate
      - uses: Sayad-Uddin-Tahsin/GHBall@main
        with:
          username: ${{ github.repository_owner }}

      # Commit and push to the "GHBall" branch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Switch to or create the GHBall branch
          git checkout -B GHBall
          
          git add ghball*.svg
          git diff --staged --quiet || git commit -m "chore: update GHBall animations [skip ci]"
          
          # Push specifically to the GHBall branch on origin
          git push -u origin GHBall
