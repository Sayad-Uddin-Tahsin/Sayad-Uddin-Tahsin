name: Generate GHBall Animation

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Generate GHBall animation
      - uses: Sayad-Uddin-Tahsin/GHBall@main
        with:
          username: ${{ github.repository_owner }}
